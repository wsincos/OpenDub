services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    volumes:
      - opendub-workspace:/workspace
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  opendub-workspace:

