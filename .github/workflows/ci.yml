name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.3"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Python dependencies
        run: uv sync --all-groups --frozen
      - name: Install Web dependencies
        run: npm exec --yes --package=pnpm@9.15.0 -- pnpm install --frozen-lockfile
      - name: Run quality gate
        run: make check
      - name: Verify audited model registry
        run: uv run python scripts/verify_registry.py model-registry/upstreams.yaml
